[project]
name = "langgraph-v1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.1",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "langgraph-cli[inmem]>=0.4.31",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "langgraph-cli[inmem]>=0.4.31",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
